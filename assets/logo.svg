<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Puerquito kawaii</title>
  <desc id="desc">Carita redondita de cerdito rosa pastel con orejitas, ojos brillantes, mejillas sonrojadas y hocico, estilo kawaii japonés y coreano.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF0F1"/>
      <stop offset="0.58" stop-color="#FFD8E2"/>
      <stop offset="1" stop-color="#FFC4D4"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB2C9"/>
      <stop offset="1" stop-color="#F58EB0"/>
    </linearGradient>
    <linearGradient id="snout" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFC2D1"/>
      <stop offset="1" stop-color="#FF9EBA"/>
    </linearGradient>
    <radialGradient id="blush">
      <stop offset="0" stop-color="#FF799D" stop-opacity="0.49"/>
      <stop offset="1" stop-color="#FF799D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ears sit behind the head -->
  <path d="M163 191 C125 173 98 128 101 72 C102 59 112 55 125 62 C176 88 202 130 201 184 Z"
        fill="url(#skin)" stroke="#CF889D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M349 191 C387 173 414 128 411 72 C410 59 400 55 387 62 C336 88 310 130 311 184 Z"
        fill="url(#skin)" stroke="#CF889D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M163 165 C140 145 125 113 123 89 C153 107 174 135 180 164 Z" fill="url(#ear)" opacity=".85"/>
  <path d="M349 165 C372 145 387 113 389 89 C359 107 338 135 332 164 Z" fill="url(#ear)" opacity=".85"/>

  <!-- Soft round face -->
  <path d="M256 121 C348 121 420 179 429 273 C436 358 373 424 288 433 C266 436 246 436 224 433 C139 424 76 358 83 273 C92 179 164 121 256 121 Z"
        fill="url(#skin)" stroke="#CF889D" stroke-width="7" stroke-linejoin="round"/>
  <path d="M139 208 C170 158 229 145 273 151" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity=".48"/>

  <!-- Blushing cheeks -->
  <ellipse cx="138" cy="312" rx="53" ry="38" fill="url(#blush)"/>
  <ellipse cx="374" cy="312" rx="53" ry="38" fill="url(#blush)"/>

  <!-- Sparkly eyes -->
  <ellipse cx="189" cy="274" rx="14" ry="21" fill="#49333E"/>
  <ellipse cx="323" cy="274" rx="14" ry="21" fill="#49333E"/>
  <circle cx="194" cy="266" r="5.2" fill="#FFFFFF"/>
  <circle cx="328" cy="266" r="5.2" fill="#FFFFFF"/>
  <circle cx="185" cy="280" r="2.6" fill="#FFFFFF" opacity=".8"/>
  <circle cx="319" cy="280" r="2.6" fill="#FFFFFF" opacity=".8"/>

  <!-- Tiny happy mouth, mostly tucked behind the snout -->
  <path d="M242 380 Q256 394 270 380" fill="none" stroke="#AC647D" stroke-width="5" stroke-linecap="round"/>

  <!-- Big squishy oval snout -->
  <ellipse cx="256" cy="347" rx="78" ry="53" fill="url(#snout)" stroke="#D7819C" stroke-width="5.5"/>
  <ellipse cx="231" cy="348" rx="12" ry="18" fill="#BB6884"/>
  <ellipse cx="281" cy="348" rx="12" ry="18" fill="#BB6884"/>
  <ellipse cx="219" cy="320" rx="21" ry="9" fill="#FFFFFF" opacity=".28" transform="rotate(-18 219 320)"/>

  <!-- Dainty cheek accents -->
  <path d="M120 306 L125 302 M136 312 L141 308" stroke="#F793AD" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <path d="M372 308 L377 312 M387 302 L392 306" stroke="#F793AD" stroke-width="4" stroke-linecap="round" opacity=".8"/>
</svg>
